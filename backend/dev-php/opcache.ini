; Loaded only by serve.cmd / serve.sh, through PHP_INI_SCAN_DIR -- see those files.
;
; XAMPP's D:\xampp\php\php.ini ships no opcache at all, so every local request
; recompiled the whole Laravel framework from source: ~215ms per API call and
; 1.37s for six parallel calls. With opcache the same calls take ~55ms and
; ~0.43s. Production (the Railway image) already has opcache.enable=1, which is
; why the same code feels fast there and slow here.
zend_extension=opcache
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; validate_timestamps keeps edited PHP files in effect without a restart, so
; this stays safe during development. revalidate_freq=2 (PHP's default) is the
; cheap setting: 0 re-checks every cached script on every request and costs
; ~35ms -- 90ms per call instead of 55ms. Worst case a saved edit takes 2
; seconds to show up.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
